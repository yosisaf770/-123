<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>חוזרים למצרים 2026</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React and Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-auth-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@400;700;800&display=swap');
        body { font-family: 'Assistant', sans-serif; background-color: #f0f9ff; margin: 0; }
        .serif-font { font-family: 'Georgia', serif; }
        .app-container { min-height: 100vh; padding-bottom: 3rem; }
        html, body { overflow-x: hidden; width: 100%; }
        .transition-all { transition: all 0.2s ease-in-out; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- SVGs Icons ---
        const Icons = {
            Plus: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>,
            Trash: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>,
            Wallet: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"></rect><line x1="2" y1="10" x2="22" y2="10"></line></svg>,
            Arrow: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="7 17 2 12 7 7"></polyline><polyline points="17 7 22 12 17 17"></polyline><line x1="2" y1="12" x2="22" y2="12"></line></svg>,
            Send: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>,
            User: () => <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>,
            History: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>,
            X: () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>,
            Cloud: () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"></path></svg>,
            CloudOff: () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22.61 16.95A5 5 0 0 0 18 10h-1.26a8 8 0 0 0-7.05-6M5 5l14 14"></path><path d="M14.5 9a3.5 3.5 0 0 0-6.84 1H7a5 5 0 0 0-4.91 4.15"></path></svg>,
            WifiOff: () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="1" y1="1" x2="23" y2="23"></line><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path><path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path><path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path><path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path><path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path><line x1="12" y1="20" x2="12.01" y2="20"></line></svg>
        };

        // --- Configuration ---
        let firebaseConfig = {
            apiKey: "YOUR_API_KEY", 
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        try {
            if (typeof __firebase_config !== 'undefined' && __firebase_config) {
                firebaseConfig = JSON.parse(__firebase_config);
            }
        } catch (e) {}

        const currentAppId = typeof __app_id !== 'undefined' ? __app_id : 'egypt-trip-2026';
        const isFirebaseActive = firebaseConfig.apiKey && firebaseConfig.apiKey !== "YOUR_API_KEY";

        if (isFirebaseActive) {
            try {
                firebase.initializeApp(firebaseConfig);
            } catch (e) { console.error("Firebase init fail"); }
        }
        
        const db = isFirebaseActive ? firebase.firestore() : null;
        const auth = isFirebaseActive ? firebase.auth() : null;

        const FRIENDS = ['בני ממטרה', 'יוסי הגבר', 'מוחמד אליעזר', 'שמעון הצדיק', 'מנדי הסובל'];

        function App() {
            const [user, setUser] = useState(null);
            const [expenses, setExpenses] = useState([]);
            const [loading, setLoading] = useState(true);
            const [isOnline, setIsOnline] = useState(navigator.onLine);
            const [confirmDeleteId, setConfirmDeleteId] = useState(null);
            const [inputs, setInputs] = useState(
                FRIENDS.reduce((acc, name) => ({ ...acc, [name]: { amount: '', description: '' } }), {})
            );

            // מעקב אחרי מצב חיבור לאינטרנט
            useEffect(() => {
                const handleOnline = () => setIsOnline(true);
                const handleOffline = () => setIsOnline(false);
                window.addEventListener('online', handleOnline);
                window.addEventListener('offline', handleOffline);
                return () => {
                    window.removeEventListener('online', handleOnline);
                    window.removeEventListener('offline', handleOffline);
                };
            }, []);

            // טעינה התחלתית
            useEffect(() => {
                if (isFirebaseActive && isOnline) {
                    auth.signInAnonymously()
                        .then(cred => setUser(cred.user))
                        .catch(() => loadFromLocal());
                } else {
                    loadFromLocal();
                }
            }, [isOnline]);

            const loadFromLocal = () => {
                const saved = localStorage.getItem('egypt_trip_voffline');
                if (saved) setExpenses(JSON.parse(saved));
                setLoading(false);
            };

            // סנכרון נתונים
            useEffect(() => {
                if (!isFirebaseActive || !isOnline) {
                    localStorage.setItem('egypt_trip_voffline', JSON.stringify(expenses));
                    return;
                }
                if (!user || !db) return;
                
                const unsubscribe = db.collection('artifacts').doc(currentAppId)
                    .collection('public').doc('data').collection('expenses')
                    .onSnapshot((snapshot) => {
                        const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                        data.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
                        setExpenses(data);
                        setLoading(false);
                    }, () => loadFromLocal());
                return () => unsubscribe();
            }, [user, isOnline, isFirebaseActive ? null : expenses]);

            const calcs = useMemo(() => {
                const totals = {};
                FRIENDS.forEach(f => totals[f] = 0);
                let grand = 0;
                expenses.forEach(e => {
                    const val = parseFloat(e.amount) || 0;
                    totals[e.payer] += val;
                    grand += val;
                });
                const avg = grand / FRIENDS.length;
                const bals = FRIENDS.map(n => ({ name: n, balance: totals[n] - avg, total: totals[n] }));
                const sett = [];
                const d = bals.filter(b => b.balance < -0.01).sort((a, b) => a.balance - b.balance);
                const c = bals.filter(b => b.balance > 0.01).sort((a, b) => b.balance - a.balance);
                let di = 0, ci = 0;
                const td = d.map(x => ({...x})), tc = c.map(x => ({...x}));
                while (di < td.length && ci < tc.length) {
                    const v = Math.min(Math.abs(td[di].balance), tc[ci].balance);
                    sett.push({ from: td[di].name, to: tc[ci].name, amount: v });
                    td[di].balance += v; tc[ci].balance -= v;
                    if (Math.abs(td[di].balance) < 0.01) di++;
                    if (Math.abs(tc[ci].balance) < 0.01) ci++;
                }
                return { grand, avg, bals, sett };
            }, [expenses]);

            const add = async (name) => {
                const { amount, description } = inputs[name];
                if (!amount || !description) return;
                
                const newExp = {
                    amount: parseFloat(amount),
                    description,
                    payer: name,
                    createdAt: (isFirebaseActive && isOnline) ? firebase.firestore.FieldValue.serverTimestamp() : { seconds: Math.floor(Date.now()/1000) }
                };

                if (isFirebaseActive && user && isOnline) {
                    try {
                        await db.collection('artifacts').doc(currentAppId).collection('public').doc('data').collection('expenses').add(newExp);
                    } catch (e) {
                        const localExp = { id: Date.now().toString(), ...newExp };
                        setExpenses(prev => [localExp, ...prev]);
                    }
                } else {
                    const localExp = { id: Date.now().toString(), ...newExp };
                    setExpenses(prev => [localExp, ...prev]);
                }
                setInputs(prev => ({ ...prev, [name]: { amount: '', description: '' } }));
            };

            const del = async (id) => {
                if (isFirebaseActive && user && isOnline) {
                    try {
                        await db.collection('artifacts').doc(currentAppId).collection('public').doc('data').collection('expenses').doc(id).delete();
                    } catch (e) {
                        setExpenses(prev => prev.filter(e => e.id !== id));
                    }
                } else {
                    setExpenses(prev => prev.filter(e => e.id !== id));
                }
                setConfirmDeleteId(null);
            };

            if (loading && isFirebaseActive && isOnline && !user) {
                return <div className="flex items-center justify-center min-h-screen font-black text-sky-600">מתחבר...</div>;
            }

            return (
                <div className="app-container">
                    {/* Status Bar המעודכן */}
                    <div className={`text-[10px] py-1.5 px-4 flex items-center justify-center gap-2 font-black uppercase tracking-widest transition-colors ${!isOnline ? 'bg-red-500 text-white animate-pulse' : (isFirebaseActive ? 'bg-green-500 text-white' : 'bg-amber-400 text-amber-900')}`}>
                        {!isOnline ? <Icons.WifiOff /> : (isFirebaseActive ? <Icons.Cloud /> : <Icons.CloudOff />)}
                        {!isOnline ? 'אופליין - נשמר רק על הטלפון' : (isFirebaseActive ? 'מצב ענן: מסונכרן' : 'מצב מקומי: ללא סנכרון')}
                    </div>

                    <header className="bg-gradient-to-br from-sky-500 to-sky-400 text-white text-center py-12 px-6 rounded-b-[4rem] shadow-2xl mb-10 relative overflow-hidden">
                        <h1 className="text-4xl font-black drop-shadow-xl text-center leading-tight">חוזרים למצרים <span className="text-amber-300 italic">2026</span></h1>
                        <p className="text-xs font-bold opacity-90 mt-2 uppercase tracking-[0.3em] text-sky-100">ניהול כספים משותף</p>
                    </header>

                    <main className="max-w-5xl mx-auto px-4 space-y-12">
                        {/* Input Grid */}
                        <div className="space-y-6">
                            <h2 className="text-center font-black text-slate-400 uppercase tracking-widest text-[10px] flex items-center justify-center gap-2">
                                <Icons.Plus /> הזנת הוצאה
                            </h2>
                            <div className="flex flex-col items-center gap-4">
                                <div className="flex flex-wrap justify-center gap-4 w-full">
                                    {FRIENDS.slice(0, 3).map(name => (
                                        <div key={name} className="bg-amber-400 p-5 rounded-[2.5rem] shadow-xl border-b-8 border-amber-600 w-full sm:w-56 lg:w-64 transition-all">
                                            <div className="bg-white/40 py-3 rounded-2xl text-center mb-4 shadow-inner border border-white/20">
                                                <span className="font-serif italic font-black text-2xl text-slate-900">{name}</span>
                                            </div>
                                            <div className="space-y-3">
                                                <input type="number" placeholder="₪" className="w-full p-3 rounded-xl outline-none text-center font-black text-lg shadow-sm" 
                                                       value={inputs[name].amount} onChange={e => setInputs({...inputs, [name]: {...inputs[name], amount: e.target.value}})} />
                                                <input type="text" placeholder="עבור מה?" className="w-full p-2.5 rounded-xl outline-none text-xs text-center bg-white/50 focus:bg-white" 
                                                       value={inputs[name].description} onChange={e => setInputs({...inputs, [name]: {...inputs[name], description: e.target.value}})} />
                                                <button onClick={() => add(name)} className="w-full bg-slate-950 text-amber-300 py-3 rounded-xl font-black flex items-center justify-center gap-2 shadow-lg active:scale-95 transition-all">
                                                    <Icons.Send /> עדכן
                                                </button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                                <div className="flex flex-wrap justify-center gap-4 w-full">
                                    {FRIENDS.slice(3, 5).map(name => (
                                        <div key={name} className="bg-amber-400 p-5 rounded-[2.5rem] shadow-xl border-b-8 border-amber-600 w-full sm:w-56 lg:w-64 transition-all">
                                            <div className="bg-white/40 py-3 rounded-2xl text-center mb-4 shadow-inner border border-white/20">
                                                <span className="font-serif italic font-black text-2xl text-slate-900">{name}</span>
                                            </div>
                                            <div className="space-y-3">
                                                <input type="number" placeholder="₪" className="w-full p-3 rounded-xl outline-none text-center font-black text-lg shadow-sm" 
                                                       value={inputs[name].amount} onChange={e => setInputs({...inputs, [name]: {...inputs[name], amount: e.target.value}})} />
                                                <input type="text" placeholder="מה הפעם?" className="w-full p-2.5 rounded-xl outline-none text-xs text-center bg-white/50 focus:bg-white" 
                                                       value={inputs[name].description} onChange={e => setInputs({...inputs, [name]: {...inputs[name], description: e.target.value}})} />
                                                <button onClick={() => add(name)} className="w-full bg-slate-950 text-amber-300 py-3 rounded-xl font-black flex items-center justify-center gap-2 shadow-lg active:scale-95 transition-all">
                                                    <Icons.Send /> עדכן
                                                </button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>

                        {/* Summary Section */}
                        <div className="bg-gradient-to-br from-orange-500 to-amber-600 rounded-[3.5rem] p-8 text-white shadow-2xl relative border-2 border-white/10 overflow-hidden">
                            <div className="flex flex-col md:flex-row justify-between items-center gap-6 mb-10 text-center md:text-right">
                                <div>
                                    <h2 className="text-2xl font-black flex items-center justify-center md:justify-start gap-3"><Icons.Wallet /> מצב הקופה</h2>
                                    <p className="opacity-70 text-xs font-bold uppercase mt-1 tracking-widest">₪{calcs.avg.toFixed(0)} ממוצע לאדם</p>
                                </div>
                                <div className="bg-white/20 backdrop-blur-xl px-10 py-5 rounded-[2.5rem] border border-white/10 shadow-inner">
                                    <p className="opacity-40 text-[10px] font-black uppercase mb-1 tracking-widest">סה"כ הוצאות</p>
                                    <span className="text-5xl font-black tracking-tighter">₪{calcs.grand.toLocaleString()}</span>
                                </div>
                            </div>
                            <div className="flex flex-wrap gap-4 justify-center">
                                {calcs.bals.map(b => (
                                    <div key={b.name} className="bg-black/10 backdrop-blur-md p-4 rounded-[2rem] w-32 text-center border border-white/5 transition-all">
                                        <div className="text-[11px] font-black opacity-60 truncate mb-1">{b.name}</div>
                                        <div className="text-lg font-black mb-2">₪{b.total.toLocaleString()}</div>
                                        <div className={`text-[10px] font-black px-2 py-1 rounded-xl inline-block ${b.balance >= 0 ? 'bg-sky-400 text-sky-950 shadow-sm' : 'bg-white/10 text-white'}`}>
                                            {b.balance >= 0 ? '+' : ''}{b.balance.toFixed(0)}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* Debts and History */}
                        <div className="grid lg:grid-cols-2 gap-8 items-start">
                            <div className="bg-white p-8 rounded-[3.5rem] shadow-xl border border-sky-100">
                                <h2 className="font-black mb-8 flex items-center gap-3 text-sky-600 uppercase text-lg tracking-tighter leading-none"><Icons.Arrow /> סיכום חובות</h2>
                                <div className="space-y-4">
                                    {calcs.sett.length === 0 ? (
                                        <div className="text-center py-16 bg-sky-50 rounded-[2.5rem] border-2 border-dashed border-sky-200 text-slate-400 font-bold italic text-sm">הכל מאוזן לגמרי!</div>
                                    ) : calcs.sett.map((s, i) => (
                                        <div key={i} className="flex items-center justify-between p-4 bg-sky-50 rounded-2xl border border-sky-100 shadow-sm">
                                            <span className="font-black text-slate-800 text-sm">{s.from}</span>
                                            <div className="flex flex-col items-center">
                                                <span className="text-sky-500 font-black text-lg leading-none">₪{s.amount.toFixed(0)}</span>
                                                <div className="text-sky-200"><Icons.Arrow /></div>
                                            </div>
                                            <span className="font-black text-slate-800 text-sm">{s.to}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            <div className="bg-white p-8 rounded-[3.5rem] shadow-xl border border-sky-100 flex flex-col h-[500px]">
                                <div className="flex justify-between items-center mb-8">
                                    <h2 className="font-black flex items-center gap-3 text-slate-400 uppercase text-lg tracking-tighter"><Icons.History /> היסטוריה</h2>
                                    <span className="bg-slate-100 text-slate-500 px-3 py-1 rounded-full text-[10px] font-black">{expenses.length} פעולות</span>
                                </div>
                                <div className="overflow-y-auto flex-1 space-y-3">
                                    {expenses.length === 0 ? (
                                        <p className="text-center py-20 opacity-20 italic font-black uppercase tracking-widest text-sm">אין תנועות עדיין</p>
                                    ) : expenses.map(e => (
                                        <div key={e.id} className="flex justify-between items-center p-4 bg-slate-50 rounded-2xl border border-transparent hover:border-sky-100 transition-all group">
                                            <div className="text-right flex-1 min-w-0 pr-2">
                                                <div className="text-sm font-black text-slate-800 truncate leading-tight">{e.description}</div>
                                                <div className="text-[10px] text-amber-700 font-serif italic font-black mt-1 flex items-center gap-1 opacity-70">
                                                    <Icons.User /> {e.payer}
                                                </div>
                                            </div>
                                            <div className="flex items-center gap-3">
                                                <div className="font-black text-lg tracking-tighter">₪{e.amount}</div>
                                                
                                                {confirmDeleteId === e.id ? (
                                                    <div className="flex items-center gap-1">
                                                        <button 
                                                            onClick={() => del(e.id)} 
                                                            className="bg-red-500 text-white p-2 rounded-lg text-[10px] font-black shadow-md hover:bg-red-600 transition-colors"
                                                        >
                                                            מחק?
                                                        </button>
                                                        <button 
                                                            onClick={() => setConfirmDeleteId(null)} 
                                                            className="bg-slate-200 text-slate-600 p-2 rounded-lg"
                                                        >
                                                            <Icons.X />
                                                        </button>
                                                    </div>
                                                ) : (
                                                    <button 
                                                        onClick={() => setConfirmDeleteId(e.id)} 
                                                        className="text-red-400 hover:text-red-600 p-2 transition-all active:scale-90"
                                                    >
                                                        <Icons.Trash />
                                                    </button>
                                                )}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </main>

                    <footer className="text-center mt-16 py-12 border-t border-sky-100 opacity-20 text-[10px] font-black uppercase tracking-[0.6em]">
                        © 2026 EGYPT EXPEDITION ledger
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
