<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>חוזרים למצרים 2026</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React and Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Firebase SDKs (Compat version) -->
    <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-auth-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@400;700;800&display=swap');
        body { font-family: 'Assistant', sans-serif; background-color: #f0f9ff; }
        .serif-font { font-family: 'Georgia', serif; }
        .app-container { min-height: 100vh; padding-bottom: 3rem; }
        html, body { overflow-x: hidden; }
        /* Smooth transitions for interactive elements */
        .transition-all { transition: all 0.2s ease-in-out; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- SVGs Icons (Self-contained) ---
        const Icons = {
            Plus: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>,
            Trash: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>,
            Wallet: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"></rect><line x1="2" y1="10" x2="22" y2="10"></line></svg>,
            Arrow: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="7 17 2 12 7 7"></polyline><polyline points="17 7 22 12 17 17"></polyline><line x1="2" y1="12" x2="22" y2="12"></line></svg>,
            Send: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>,
            User: () => <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>,
            History: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
        };

        // --- Firebase Configuration ---
        let config = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // הזרקה אוטומטית של הגדרות לצרכי פיתוח (אם קיימות)
        try {
            if (typeof __firebase_config !== 'undefined' && __firebase_config) {
                config = JSON.parse(__firebase_config);
            }
        } catch (e) {
            console.error("Config parse error:", e);
        }

        const currentAppId = typeof __app_id !== 'undefined' ? __app_id : 'egypt-trip-2026';
        const isConfigValid = config.apiKey && config.apiKey !== "YOUR_API_KEY";

        // אתחול Firebase
        if (isConfigValid) {
            firebase.initializeApp(config);
        }
        const db = isConfigValid ? firebase.firestore() : null;
        const auth = isConfigValid ? firebase.auth() : null;

        const FRIENDS = ['בני ממטרה', 'יוסי הגבר', 'מוחמד אליעזר', 'שמעון הצדיק', 'מנדי הסובל'];

        function App() {
            const [user, setUser] = useState(null);
            const [expenses, setExpenses] = useState([]);
            const [loading, setLoading] = useState(true);
            const [inputs, setInputs] = useState(
                FRIENDS.reduce((acc, name) => ({ ...acc, [name]: { amount: '', description: '' } }), {})
            );

            // שלב 1: התחברות חובה לפני הכל
            useEffect(() => {
                if (!isConfigValid) {
                    setLoading(false);
                    return;
                }
                
                const initAuth = async () => {
                    try {
                        // ניסיון התחברות אנונימית
                        const cred = await auth.signInAnonymously();
                        setUser(cred.user);
                    } catch (err) {
                        console.error("Authentication error:", err);
                        setLoading(false);
                    }
                };
                initAuth();
            }, []);

            // שלב 2: קריאת נתונים רק אחרי שהמשתמש מזוהה
            useEffect(() => {
                if (!user || !db) return;

                // גישה למסד הנתונים לפי הנתיב המומלץ
                const collectionRef = db.collection('artifacts').doc(currentAppId)
                    .collection('public').doc('data').collection('expenses');

                const unsubscribe = collectionRef.onSnapshot((snapshot) => {
                    const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    // מיון ידני כדי למנוע דרישת אינדקסים מורכבים ב-Firestore
                    data.sort((a, b) => {
                        const timeA = a.createdAt?.seconds || 0;
                        const timeB = b.createdAt?.seconds || 0;
                        return timeB - timeA;
                    });
                    setExpenses(data);
                    setLoading(false);
                }, (err) => {
                    console.error("Firestore error:", err);
                    setLoading(false);
                });

                return () => unsubscribe();
            }, [user]);

            const calcs = useMemo(() => {
                const totals = {};
                FRIENDS.forEach(f => totals[f] = 0);
                let grand = 0;
                expenses.forEach(e => {
                    const val = parseFloat(e.amount) || 0;
                    totals[e.payer] += val;
                    grand += val;
                });
                const avg = grand / FRIENDS.length;
                const bals = FRIENDS.map(n => ({ 
                    name: n, 
                    balance: totals[n] - avg, 
                    total: totals[n] 
                }));
                const sett = [];
                const d = bals.filter(b => b.balance < -0.01).sort((a, b) => a.balance - b.balance);
                const c = bals.filter(b => b.balance > 0.01).sort((a, b) => b.balance - a.balance);
                let di = 0, ci = 0;
                const td = d.map(x => ({...x})), tc = c.map(x => ({...x}));
                while (di < td.length && ci < tc.length) {
                    const v = Math.min(Math.abs(td[di].balance), tc[ci].balance);
                    sett.push({ from: td[di].name, to: tc[ci].name, amount: v });
                    td[di].balance += v; tc[ci].balance -= v;
                    if (Math.abs(td[di].balance) < 0.01) di++;
                    if (Math.abs(tc[ci].balance) < 0.01) ci++;
                }
                return { grand, avg, bals, sett };
            }, [expenses]);

            const add = async (name) => {
                const { amount, description } = inputs[name];
                if (!amount || !description || !user) return;
                try {
                    await db.collection('artifacts').doc(currentAppId).collection('public').doc('data').collection('expenses').add({
                        amount: parseFloat(amount),
                        description,
                        payer: name,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    setInputs(prev => ({ ...prev, [name]: { amount: '', description: '' } }));
                } catch (e) { 
                    console.error("Error adding doc:", e);
                    alert("שגיאה בשמירת הנתונים"); 
                }
            };

            const del = async (id) => {
                if (!user || !db) return;
                try {
                    await db.collection('artifacts').doc(currentAppId).collection('public').doc('data').collection('expenses').doc(id).delete();
                } catch (e) {
                    console.error("Error deleting doc:", e);
                }
            };

            if (!isConfigValid) return (
                <div className="flex items-center justify-center min-h-screen p-6 text-center">
                    <div className="bg-white p-10 rounded-[3rem] shadow-2xl border-4 border-amber-400 max-w-sm">
                        <div className="flex justify-center mb-4 text-amber-500">
                            <Icons.Plus />
                        </div>
                        <h2 className="text-2xl font-black mb-4">חסרים פרטי Firebase</h2>
                        <p className="text-slate-600 text-sm mb-6 leading-relaxed">עליך לערוך את הקובץ ולהחליף את YOUR_API_KEY ופרטי הפרויקט בפרטים מהחשבון שלך ב-Firebase Console כדי שהאפליקציה תעבוד.</p>
                        <div className="text-[10px] bg-slate-100 p-2 rounded text-left font-mono opacity-50">Config Section (Lines 52-59)</div>
                    </div>
                </div>
            );

            if (loading && !user) return (
                <div className="flex flex-col items-center justify-center min-h-screen font-black text-sky-600 animate-pulse">
                    <div className="mb-4"><Icons.Wallet /></div>
                    מתחבר למערכת...
                </div>
            );

            return (
                <div className="app-container">
                    <header className="bg-gradient-to-br from-sky-500 to-sky-400 text-white text-center py-12 px-6 rounded-b-[4rem] shadow-2xl mb-10 relative overflow-hidden">
                        <div className="absolute top-0 right-0 opacity-10 pointer-events-none transform translate-x-1/4 -translate-y-1/4">
                            <Icons.Wallet />
                        </div>
                        <h1 className="text-4xl font-black drop-shadow-xl">חוזרים למצרים <span className="text-amber-300 italic">2026</span></h1>
                        <p className="text-xs font-bold opacity-90 mt-2 uppercase tracking-[0.3em] text-sky-100">יומן מסע כספי משותף</p>
                    </header>

                    <main className="max-w-5xl mx-auto px-4 space-y-12">
                        {/* Input Grid: 3 top, 2 bottom centered */}
                        <div className="space-y-6">
                            <h2 className="text-center font-black text-slate-400 uppercase tracking-widest text-xs flex items-center justify-center gap-2">
                                <Icons.Plus /> הזנת הוצאה מהירה
                            </h2>
                            <div className="flex flex-col items-center gap-4">
                                {/* שורה ראשונה - 3 אנשים */}
                                <div className="flex flex-wrap justify-center gap-4 w-full">
                                    {FRIENDS.slice(0, 3).map(name => (
                                        <div key={name} className="bg-amber-400 p-5 rounded-[2.5rem] shadow-xl border-b-8 border-amber-600 w-full sm:w-56 lg:w-64 transition-all hover:translate-y-[-2px]">
                                            <div className="bg-white/40 py-3 rounded-2xl text-center mb-4 shadow-inner border border-white/20">
                                                <span className="font-serif italic font-black text-2xl text-slate-900">{name}</span>
                                            </div>
                                            <div className="space-y-3">
                                                <input type="number" placeholder="סכום ₪" className="w-full p-3 rounded-xl outline-none text-center font-black text-lg shadow-sm focus:ring-4 focus:ring-orange-500/20" 
                                                       value={inputs[name].amount} onChange={e => setInputs({...inputs, [name]: {...inputs[name], amount: e.target.value}})} />
                                                <input type="text" placeholder="עבור מה?" className="w-full p-2.5 rounded-xl outline-none text-xs text-center bg-white/50 focus:bg-white" 
                                                       value={inputs[name].description} onChange={e => setInputs({...inputs, [name]: {...inputs[name], description: e.target.value}})} />
                                                <button onClick={() => add(name)} className="w-full bg-slate-950 text-amber-300 py-3 rounded-xl font-black flex items-center justify-center gap-2 shadow-lg active:scale-95 transition-all">
                                                    <Icons.Send /> עדכן
                                                </button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                                {/* שורה שניה - 2 אנשים ממורכזים */}
                                <div className="flex flex-wrap justify-center gap-4 w-full">
                                    {FRIENDS.slice(3, 5).map(name => (
                                        <div key={name} className="bg-amber-400 p-5 rounded-[2.5rem] shadow-xl border-b-8 border-amber-600 w-full sm:w-56 lg:w-64 transition-all hover:translate-y-[-2px]">
                                            <div className="bg-white/40 py-3 rounded-2xl text-center mb-4 shadow-inner border border-white/20">
                                                <span className="font-serif italic font-black text-2xl text-slate-900">{name}</span>
                                            </div>
                                            <div className="space-y-3">
                                                <input type="number" placeholder="סכום ₪" className="w-full p-3 rounded-xl outline-none text-center font-black text-lg shadow-sm focus:ring-4 focus:ring-orange-500/20" 
                                                       value={inputs[name].amount} onChange={e => setInputs({...inputs, [name]: {...inputs[name], amount: e.target.value}})} />
                                                <input type="text" placeholder="מה הפעם?" className="w-full p-2.5 rounded-xl outline-none text-xs text-center bg-white/50 focus:bg-white" 
                                                       value={inputs[name].description} onChange={e => setInputs({...inputs, [name]: {...inputs[name], description: e.target.value}})} />
                                                <button onClick={() => add(name)} className="w-full bg-slate-950 text-amber-300 py-3 rounded-xl font-black flex items-center justify-center gap-2 shadow-lg active:scale-95 transition-all">
                                                    <Icons.Send /> עדכן
                                                </button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>

                        {/* Summary Section */}
                        <div className="bg-gradient-to-br from-orange-500 to-amber-600 rounded-[3.5rem] p-8 text-white shadow-2xl relative overflow-hidden border-2 border-white/10">
                            <div className="flex flex-col md:flex-row justify-between items-center gap-6 mb-10">
                                <div className="text-center md:text-right">
                                    <h2 className="text-2xl font-black flex items-center justify-center md:justify-start gap-3"><Icons.Wallet /> סיכום הקופה</h2>
                                    <p className="opacity-70 text-xs font-bold uppercase mt-1 tracking-tight">ממוצע לאדם: ₪{calcs.avg.toFixed(0)}</p>
                                </div>
                                <div className="bg-white/20 backdrop-blur-xl px-10 py-5 rounded-[2.5rem] border border-white/10 text-center shadow-inner">
                                    <p className="opacity-40 text-[10px] font-black uppercase mb-1 tracking-widest">סה"כ הוצאות</p>
                                    <span className="text-5xl font-black tracking-tighter">₪{calcs.grand.toLocaleString()}</span>
                                </div>
                            </div>
                            <div className="flex flex-wrap gap-4 justify-center">
                                {calcs.bals.map(b => (
                                    <div key={b.name} className="bg-black/10 backdrop-blur-md p-4 rounded-[2rem] w-32 text-center border border-white/5 hover:bg-black/20 transition-all">
                                        <div className="text-[11px] font-black opacity-60 truncate mb-1">{b.name}</div>
                                        <div className="text-lg font-black leading-none mb-2">₪{b.total.toLocaleString()}</div>
                                        <div className={`text-[10px] font-black px-2 py-1 rounded-xl inline-block ${b.balance >= 0 ? 'bg-sky-400 text-sky-950' : 'bg-white/10 text-white'}`}>
                                            {b.balance >= 0 ? '+' : ''}{b.balance.toFixed(0)}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* Debts & History Grid */}
                        <div className="grid lg:grid-cols-2 gap-8 items-start">
                            {/* Debts */}
                            <div className="bg-white p-8 rounded-[3.5rem] shadow-xl border border-sky-100 h-full">
                                <h2 className="font-black mb-8 flex items-center gap-3 text-sky-600 uppercase tracking-tighter text-lg"><Icons.Arrow /> מי חייב למי?</h2>
                                <div className="space-y-4">
                                    {calcs.sett.length === 0 ? (
                                        <div className="text-center py-16 bg-sky-50 rounded-[2.5rem] border-2 border-dashed border-sky-200">
                                            <span className="text-sky-300 block mb-2"><Icons.Arrow /></span>
                                            <p className="text-slate-400 font-bold italic text-sm">הכל מאוזן, אין חובות!</p>
                                        </div>
                                    ) : calcs.sett.map((s, i) => (
                                        <div key={i} className="flex items-center justify-between p-4 bg-sky-50 rounded-2xl border border-sky-100 transition-all hover:bg-white hover:shadow-md">
                                            <span className="font-black text-slate-800 text-sm">{s.from}</span>
                                            <div className="flex flex-col items-center">
                                                <span className="text-sky-500 font-black text-lg leading-none">₪{s.amount.toFixed(0)}</span>
                                                <span className="text-[10px] opacity-30 mt-1 uppercase font-black">מעביר ל...</span>
                                            </div>
                                            <span className="font-black text-slate-800 text-sm">{s.to}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            {/* History */}
                            <div className="bg-white p-8 rounded-[3.5rem] shadow-xl border border-sky-100 flex flex-col h-[500px]">
                                <div className="flex justify-between items-center mb-8">
                                    <h2 className="font-black flex items-center gap-3 text-slate-400 uppercase tracking-tighter text-lg"><Icons.History /> היסטוריה</h2>
                                    <span className="bg-slate-100 text-slate-500 px-3 py-1 rounded-full text-[10px] font-black">{expenses.length} פעולות</span>
                                </div>
                                <div className="overflow-y-auto flex-1 space-y-3 pr-2">
                                    {expenses.length === 0 ? (
                                        <p className="text-center py-20 opacity-20 italic text-sm font-black uppercase tracking-widest">No activity yet</p>
                                    ) : expenses.map(e => (
                                        <div key={e.id} className="flex justify-between items-center p-4 bg-slate-50 rounded-2xl border border-transparent hover:border-sky-100 transition-all group">
                                            <div className="text-right flex-1 min-w-0 pr-2">
                                                <div className="text-sm font-black text-slate-800 truncate leading-tight">{e.description}</div>
                                                <div className="text-[10px] text-amber-700 font-serif italic font-black mt-1 flex items-center gap-1 opacity-70">
                                                    <Icons.User /> {e.payer}
                                                </div>
                                            </div>
                                            <div className="flex items-center gap-4">
                                                <div className="font-black text-lg tracking-tighter">₪{e.amount}</div>
                                                <button onClick={() => del(e.id)} className="text-slate-200 hover:text-red-500 p-2 transition-all opacity-0 group-hover:opacity-100 active:scale-90">
                                                    <Icons.Trash />
                                                </button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </main>

                    <footer className="text-center mt-16 py-12 border-t border-sky-100">
                        <p className="opacity-20 text-[10px] font-black uppercase tracking-[0.6em]">© 2026 EGYPT EXPEDITION ledger</p>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
