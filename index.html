<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>חוזרים למצרים 2026</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React and Babel for running React in the browser -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Firebase SDKs (Compat version for script tags) -->
    <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-auth-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@400;700;800&display=swap');
        body { font-family: 'Assistant', sans-serif; }
        .serif-font { font-family: 'Georgia', serif; }
        
        /* Custom scrollbar for better mobile feel */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 10px; }
    </style>
</head>
<body class="bg-sky-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // Custom SVGs to replace Lucide and avoid dependency errors
        const Icons = {
            Plus: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>,
            Trash: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>,
            Wallet: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"></rect><line x1="2" y1="10" x2="22" y2="10"></line></svg>,
            ArrowLeftRight: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="7 17 2 12 7 7"></polyline><polyline points="17 7 22 12 17 17"></polyline><line x1="2" y1="12" x2="22" y2="12"></line></svg>,
            Clock: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>,
            Send: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>,
            User: () => <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        };

        // Firebase Configuration
        let firebaseConfig = {};
        try {
            firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        } catch (e) {
            console.error("Firebase config error");
        }

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'egypt-trip-2026';

        if (firebaseConfig.apiKey) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();
        const auth = firebase.auth();

        const FRIENDS = [
            'בני ממטרה',
            'יוסי הגבר',
            'מוחמד אליעזר',
            'שמעון הצדיק',
            'מנדי הסובל'
        ];

        const PyramidIcon = () => (
            <svg viewBox="0 0 100 100" className="w-8 h-8 drop-shadow-sm">
                <path d="M50 15 L85 85 L15 85 Z" fill="#f59e0b" />
                <path d="M50 15 L85 85 L65 90 L50 15" fill="#d97706" />
            </svg>
        );

        const CamelIcon = () => (
            <svg viewBox="0 0 100 100" className="w-8 h-8 drop-shadow-sm">
                <path d="M20 75 L25 75 Q27 60 30 60 L35 60 Q40 45 50 45 Q55 45 60 50 Q70 45 80 50 Q90 50 93 40 Q95 35 100 35 L100 45 Q95 45 93 55 Q90 65 80 65 L70 65 Q70 75 65 85 L60 85 L60 65 L45 65 L45 85 L40 85 L40 65 L25 65 L20 75 Z" fill="#ea580c" />
            </svg>
        );

        function App() {
            const [user, setUser] = useState(null);
            const [expenses, setExpenses] = useState([]);
            const [loading, setLoading] = useState(true);
            const [inputs, setInputs] = useState(
                FRIENDS.reduce((acc, name) => ({ ...acc, [name]: { amount: '', description: '' } }), {})
            );

            // Step 1: Handle Authentication
            useEffect(() => {
                const initAuth = async () => {
                    try {
                        const cred = await auth.signInAnonymously();
                        setUser(cred.user);
                    } catch (err) {
                        console.error("Auth failed:", err);
                        setLoading(false);
                    }
                };
                initAuth();
            }, []);

            // Step 2: Set up Snapshot Listener only after user is authenticated
            useEffect(() => {
                if (!user) return;

                // Rule 2: Fetch all then sort in JS (removing orderBy from query)
                const unsubscribe = db.collection('artifacts')
                    .doc(appId)
                    .collection('public')
                    .doc('data')
                    .collection('expenses')
                    .onSnapshot((snapshot) => {
                        const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                        // Sort in memory by createdAt desc
                        data.sort((a, b) => {
                            const timeA = a.createdAt?.seconds || 0;
                            const timeB = b.createdAt?.seconds || 0;
                            return timeB - timeA;
                        });
                        setExpenses(data);
                        setLoading(false);
                    }, (err) => {
                        console.error("Firestore error:", err);
                        setLoading(false);
                    });
                return () => unsubscribe();
            }, [user]);

            const calculations = useMemo(() => {
                const totals = {};
                FRIENDS.forEach(f => totals[f] = 0);
                let grandTotal = 0;
                expenses.forEach(exp => {
                    const val = parseFloat(exp.amount) || 0;
                    totals[exp.payer] += val;
                    grandTotal += val;
                });
                const average = grandTotal / FRIENDS.length;
                const balances = FRIENDS.map(name => ({
                    name,
                    balance: totals[name] - average,
                    totalPaid: totals[name]
                }));
                
                const settlement = [];
                const debtors = balances.filter(b => b.balance < -0.01).sort((a, b) => a.balance - b.balance);
                const creditors = balances.filter(b => b.balance > 0.01).sort((a, b) => b.balance - a.balance);
                
                let dIdx = 0, cIdx = 0;
                const tD = debtors.map(d => ({ ...d })), tC = creditors.map(c => ({ ...c }));
                
                while (dIdx < tD.length && cIdx < tC.length) {
                    const val = Math.min(Math.abs(tD[dIdx].balance), tC[cIdx].balance);
                    settlement.push({ from: tD[dIdx].name, to: tC[cIdx].name, amount: val });
                    tD[dIdx].balance += val; 
                    tC[cIdx].balance -= val;
                    if (Math.abs(tD[dIdx].balance) < 0.01) dIdx++;
                    if (Math.abs(tC[cIdx].balance) < 0.01) cIdx++;
                }
                return { grandTotal, average, balances, settlement };
            }, [expenses]);

            const handleInputChange = (name, field, value) => {
                setInputs(prev => ({ ...prev, [name]: { ...prev[name], [field]: value } }));
            };

            const addExpense = async (name) => {
                const { amount, description } = inputs[name];
                if (!amount || !description || !user) return;
                try {
                    await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('expenses').add({
                        amount: parseFloat(amount),
                        description,
                        payer: name,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    setInputs(prev => ({ ...prev, [name]: { amount: '', description: '' } }));
                } catch (err) { 
                    alert("נכשל בעדכון"); 
                }
            };

            const deleteExpense = (id) => {
                db.collection('artifacts').doc(appId).collection('public').doc('data').collection('expenses').doc(id).delete();
            };

            const ExpenseCard = ({ name }) => (
                <div className="bg-amber-400 rounded-[2.5rem] shadow-xl p-4 flex flex-col border-b-8 border-amber-600 w-full sm:w-56 lg:w-64 transition-transform active:scale-95 m-1">
                    <div className="text-center mb-4 bg-white/30 py-3 rounded-[1.5rem] shadow-inner border border-white/20">
                        <h3 className="text-2xl font-serif font-black text-slate-900 tracking-tight leading-none drop-shadow-sm italic">
                            {name}
                        </h3>
                    </div>
                    <div className="space-y-3">
                        <input 
                            type="number" placeholder="סכום ₪" inputMode="decimal"
                            className="w-full py-3 px-4 bg-white rounded-xl border-none focus:ring-4 focus:ring-orange-500 outline-none text-lg font-black text-slate-900 shadow-inner"
                            value={inputs[name].amount}
                            onChange={(e) => handleInputChange(name, 'amount', e.target.value)}
                        />
                        <input 
                            type="text" placeholder="עבור מה?"
                            className="w-full py-3 px-4 bg-white/80 rounded-xl border-none focus:ring-4 focus:ring-orange-500 outline-none text-xs font-bold text-slate-700 shadow-inner"
                            value={inputs[name].description}
                            onChange={(e) => handleInputChange(name, 'description', e.target.value)}
                        />
                        <button 
                            onClick={() => addExpense(name)}
                            disabled={!inputs[name].amount || !inputs[name].description}
                            className="w-full py-3.5 bg-slate-950 hover:bg-black disabled:bg-slate-300 text-amber-400 text-xs font-black rounded-xl shadow-lg flex items-center justify-center gap-2"
                        >
                            <Icons.Send />
                            עדכן
                        </button>
                    </div>
                </div>
            );

            if (loading && !user) return <div className="h-screen flex items-center justify-center text-amber-800 font-bold bg-sky-50">מתחבר למערכת...</div>;
            if (loading) return <div className="h-screen flex items-center justify-center text-amber-800 font-bold bg-sky-50">טוען נתונים מהפירמידות...</div>;

            return (
                <div className="min-h-screen pb-12">
                    <header className="bg-gradient-to-b from-sky-500 to-sky-400 text-white px-6 pt-10 pb-12 rounded-b-[3.5rem] shadow-xl text-center relative">
                        <div className="flex justify-center gap-4 mb-4">
                            <PyramidIcon />
                            <CamelIcon />
                        </div>
                        <h1 className="text-4xl font-black tracking-tight drop-shadow-md">חוזרים למצרים <span className="text-amber-300 italic">2026</span></h1>
                        <p className="text-xs font-bold uppercase tracking-[0.2em] opacity-80 mt-1">יומן מסע כספי משותף</p>
                    </header>

                    <main className="px-3 max-w-7xl mx-auto -mt-6 space-y-12">
                        <section className="flex flex-col items-center w-full">
                            <h2 className="text-sm font-black uppercase tracking-widest opacity-70 mb-6 flex items-center gap-2">
                                <Icons.Plus /> עדכון הוצאה אישי
                            </h2>
                            <div className="flex flex-col items-center gap-3 w-full max-w-6xl">
                                <div className="flex flex-wrap justify-center gap-3 w-full">
                                    {FRIENDS.slice(0, 3).map(name => <ExpenseCard key={name} name={name} />)}
                                </div>
                                <div className="flex flex-wrap justify-center gap-3 w-full">
                                    {FRIENDS.slice(3, 5).map(name => <ExpenseCard key={name} name={name} />)}
                                </div>
                            </div>
                        </section>

                        <div className="max-w-4xl mx-auto space-y-8">
                            <section className="bg-gradient-to-br from-orange-500 to-amber-600 p-8 rounded-[3rem] text-white shadow-2xl relative overflow-hidden border-2 border-white/20">
                                <div className="flex flex-col sm:flex-row justify-between items-center gap-6 mb-10">
                                    <div className="text-center sm:text-right">
                                        <h2 className="flex items-center justify-center sm:justify-start gap-3 text-2xl font-black"><Icons.Wallet /> מצב הקופה</h2>
                                        <p className="opacity-60 text-xs font-bold uppercase mt-1">ממוצע לאדם: ₪{calculations.average.toFixed(0)}</p>
                                    </div>
                                    <div className="bg-white/20 backdrop-blur-xl px-8 py-4 rounded-[2rem] border border-white/10 text-center shadow-inner">
                                        <p className="opacity-40 text-[10px] font-black uppercase mb-1">סה"כ כללי</p>
                                        <p className="text-4xl font-black tracking-tighter text-white">₪{calculations.grandTotal.toLocaleString()}</p>
                                    </div>
                                </div>
                                <div className="flex flex-wrap justify-center gap-3">
                                    {calculations.balances.map(b => (
                                        <div key={b.name} className="bg-black/15 p-4 rounded-3xl border border-white/5 text-center w-32 min-h-[110px] flex flex-col justify-between backdrop-blur-sm">
                                            <p className="text-[11px] font-serif italic opacity-70 font-black truncate">{b.name}</p>
                                            <p className="text-xl font-black">₪{b.totalPaid.toLocaleString()}</p>
                                            <div className={`text-[9px] font-black px-2 py-1 rounded-lg mt-2 ${b.balance >= 0 ? 'bg-sky-400 text-sky-950 shadow-sm' : 'bg-white/10 opacity-50'}`}>
                                                {b.balance >= 0 ? `+${b.balance.toFixed(0)}` : b.balance.toFixed(0)}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </section>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <section className="bg-white p-6 rounded-[3rem] shadow-xl border border-sky-100 flex flex-col items-center">
                                    <h2 className="text-lg font-black mb-6 text-slate-800 uppercase flex items-center gap-2"> <Icons.ArrowLeftRight /> סיכום חובות</h2>
                                    <div className="w-full space-y-3">
                                        {calculations.settlement.length === 0 ? <p className="text-center opacity-40 italic text-sm py-10">הכל פיקס! אין חובות.</p> : 
                                            calculations.settlement.map((s, i) => (
                                                <div key={i} className="flex flex-col p-4 bg-sky-50/50 rounded-[2rem] border border-sky-100 text-center hover:bg-white transition-colors">
                                                    <div className="flex justify-between items-center mb-2">
                                                        <span className="text-[10px] font-serif italic font-black bg-white px-3 py-1.5 rounded-xl shadow-sm border border-sky-50">{s.from}</span>
                                                        <div className="text-sky-300"><Icons.ArrowLeftRight /></div>
                                                        <span className="text-[10px] font-serif italic font-black bg-sky-600 text-white px-3 py-1.5 rounded-xl shadow-md">{s.to}</span>
                                                    </div>
                                                    <p className="text-slate-800 text-2xl font-black tracking-tighter leading-none mt-1">₪{s.amount.toFixed(0)}</p>
                                                </div>
                                            ))
                                        }
                                    </div>
                                </section>

                                <section className="bg-white rounded-[3rem] shadow-xl border border-sky-100 overflow-hidden flex flex-col">
                                    <div className="p-6 border-b border-sky-50 flex items-center justify-between bg-sky-50/20 font-black uppercase text-xs opacity-50">
                                        <div className="flex items-center gap-2"><Icons.Clock /> היסטוריה</div>
                                        <div className="bg-slate-800 text-white px-2 py-0.5 rounded-full">{expenses.length}</div>
                                    </div>
                                    <div className="flex-1 overflow-y-auto max-h-[400px] p-4 space-y-3">
                                        {expenses.length === 0 ? <p className="text-center py-20 opacity-30 italic text-xs">אין עדיין תנועות...</p> : 
                                            expenses.map((exp) => (
                                                <div key={exp.id} className="flex items-center justify-between p-4 bg-sky-50/30 rounded-2xl border border-transparent hover:border-sky-100 transition-all group">
                                                    <div className="flex-1 min-w-0 pr-1 text-right">
                                                        <p className="font-black text-slate-800 text-sm truncate">{exp.description}</p>
                                                        <p className="text-[9px] text-amber-700 font-serif italic font-black uppercase flex items-center gap-1"> 
                                                            <Icons.User /> {exp.payer}
                                                        </p>
                                                    </div>
                                                    <div className="flex items-center gap-3">
                                                        <span className="font-black text-slate-900 text-base tracking-tighter">₪{exp.amount}</span>
                                                        <button onClick={() => deleteExpense(exp.id)} className="p-2 text-slate-200 hover:text-red-500 transition-all opacity-0 group-hover:opacity-100">
                                                            <Icons.Trash />
                                                        </button>
                                                    </div>
                                                </div>
                                            ))
                                        }
                                    </div>
                                </section>
                            </div>
                        </div>
                    </main>
                    <footer className="text-center py-10 opacity-30 text-[9px] font-black uppercase tracking-[0.4em]">© 2026 חוזרים למצרים</footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
